<!doctype html>
<!--
  This is the web version of the date-night invitation.
  The page is just one big drawing area (a "canvas"). script.js draws everything on it.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- maximum-scale=1 stops phones from zooming in when he taps a text box. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>MWAHHH</title>
  <link rel="icon" href="heart.svg">
  <style>
    /* Our pixel font, loaded from the fonts folder. */
    @font-face {
      font-family: "Pixelify Sans";
      src: url("fonts/PixelifySans.ttf") format("truetype");
      font-weight: 400 700;
    }

    html, body {
      margin: 0;
      height: 100%;
      /* "dvh" = the part of the screen you can actually see (on phones, the address bar
         covers some of it). Browsers that don't know dvh use the line above instead. */
      height: 100dvh;
      /* The same lavender as the wall in the picture, so it all blends together. */
      background: #CBBED8;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* The drawing is 3 wide for every 2 tall. This makes it as big as fits on the screen. */
    canvas {
      width: min(100vw, 150vh);
      width: min(100vw, 150dvh);
      aspect-ratio: 3 / 2;
      display: block;
      /* Let the site handle finger drags itself (for scrolling lists and games),
         instead of the phone trying to scroll or zoom the page. */
      touch-action: none;
      /* Softly fade the left and right edges, so the picture blends into the page. */
      -webkit-mask-image: linear-gradient(to right, transparent, black 3%, black 97%, transparent);
      mask-image: linear-gradient(to right, transparent, black 3%, black 97%, transparent);
    }

    /* The layer for real text boxes (IM, Plan a date). script.js puts it exactly over the
       drawing and scales it to match, so these sizes are in the drawing's pixels. */
    #ui {
      position: fixed;
      left: 0;
      top: 0;
      width: 768px;
      height: 512px;
      transform-origin: 0 0;
      pointer-events: none;
    }
    .panel {
      position: absolute;
      display: none;
      pointer-events: auto;
      box-sizing: border-box;
      font-family: "Pixelify Sans", sans-serif;
      font-size: 11px;
      color: #45284A;
    }
    .panel input, .panel button {
      font: inherit;
      color: inherit;
      box-sizing: border-box;
      border: 2px solid #45284A;
      border-radius: 0;
      outline: none;
    }
    .panel input {
      background: #FFFFFF;
      padding: 3px 5px;
      width: 100%;
    }
    .panel input:focus { background: #FFF7EE; }
    .panel button {
      background: #C98298;
      color: #FFFFFF;
      font-weight: bold;
      padding: 3px 10px;
      cursor: pointer;
    }
    .panel button:hover { background: #F07A9C; }
    .panel button.cancel { background: #FFF7EE; color: #45284A; }

    /* The IM typing row: a long text box and a Send button. */
    .im-row { display: flex; gap: 4px; height: 100%; margin: 0; }
    .im-row button { flex: none; }
    .panel img { image-rendering: pixelated; display: block; }
    .emoji-button { background: #FFF7EE !important; padding: 2px 5px !important; }
    .emoji-button img { width: 18px; height: 16px; }

    /* The pixel emoji menu, popping up above the typing box. */
    .picker {
      position: absolute;
      left: 0;
      bottom: 28px;
      display: grid;
      grid-template-columns: repeat(5, 30px);
      gap: 4px;
      padding: 5px;
      background: #FFF7EE;
      border: 2px solid #45284A;
      box-shadow: 3px 3px 0 #45284A;
    }
    .picker[hidden] { display: none; }
    .picker button { background: #FFFFFF !important; padding: 3px !important; border-width: 1px; }
    .picker button:hover { background: #F8BFCB !important; }
    .picker img { width: 22px; height: 20px; }

    /* The Plan a date form (it scrolls if it's taller than the window). */
    .plan { height: 100%; overflow-y: auto; padding: 6px 10px; box-sizing: border-box; margin: 0; }
    .plan label, .reschedule label { display: block; margin-bottom: 4px; font-weight: bold; }
    .plan label input, .reschedule label input { font-weight: normal; margin-top: 1px; }
    .plan .fields > input { margin-bottom: 3px; }
    .two { display: flex; gap: 6px; }
    .two > * { flex: 1; }
    .hint { margin: 0 0 6px; color: #C98298; font-weight: bold; min-height: 1em; }
    .section { margin: 6px 0 3px; font-weight: bold; }
    .problem { margin: 4px 0; color: #F07A9C; font-weight: bold; min-height: 1em; }
    .plan .fields > button { width: 100%; padding: 6px; font-size: 13px; }
    .sent { text-align: center; padding-top: 40px; }
    .colors { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-bottom: 4px; }
    .colors label { display: flex; align-items: center; gap: 6px; font-weight: normal; }
    .colors input[type="color"] { width: 34px; height: 22px; padding: 1px; flex: none; }
    .big { font-size: 18px; font-weight: bold; margin: 4px 0; text-align: center; }

    /* The Suggest a new time box, on top of the letter. */
    .reschedule {
      height: 100%; margin: 0; padding: 8px 12px; box-sizing: border-box;
      background: #FFF7EE; border: 3px solid #45284A; box-shadow: 5px 5px 0 #45284A;
    }
  </style>
</head>
<body>
  <canvas id="screen" width="1536" height="1024"></canvas>
  <div id="ui"></div>
  <!-- Firebase (by Google) stores guestbook notes until Tayler reads them. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
